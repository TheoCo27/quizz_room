groups:
  - name: transcendence-alerts
    rules:
      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Backend is down"
          description: "Prometheus cannot scrape the NestJS backend."

      - alert: HighHttp5xxErrors
        expr: sum(rate(http_requests_total{status_code=~"5.."}[1m])) > 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "HTTP 5xx errors detected"
          description: "The backend returned HTTP 5xx errors."
