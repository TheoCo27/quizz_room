services:
  frontend:
    image: frontend_img
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quiz_frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - ./certs:/certs:ro
      - /app/node_modules
    env_file:
      - .env
    environment:
      BACKEND_TARGET: https://backend:4000
      NODE_EXTRA_CA_CERTS: /certs/dev-localhost-ca.pem
      SSL_CERT_FILE: /certs/dev-localhost-ca.pem
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const url = 'https://localhost:3000'; fetch(url).then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  backend:
    image: backend_img
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quiz_backend
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      - ./backend:/app
      - ./certs:/certs:ro
      - /app/node_modules
    env_file:
      - .env
    environment:
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://localhost:3000}
      NODE_ENV: ${NODE_ENV:-}
      NODE_EXTRA_CA_CERTS: /certs/dev-localhost-ca.pem
      SSL_CERT_FILE: /certs/dev-localhost-ca.pem
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('https://127.0.0.1:4000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s
    restart: unless-stopped

  prisma-studio:
    image: backend_img
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quiz_prisma_studio
    profiles:
      - dev
    command:
      [
        "sh",
        "./scripts/start-prisma-studio-dev.sh",
      ]
    ports:
      - "127.0.0.1:${PRISMA_STUDIO_PORT:-5555}:5555"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PRISMA_STUDIO_PROXY_PORT: 5555
      PRISMA_STUDIO_INTERNAL_PORT: 5556
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5555').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  db:
    image: db_img
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: quiz_db
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: quiz_prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: quiz_grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: quiz_node_exporter
    restart: unless-stopped
    ports:
     - "9100:9100"

volumes:
  postgres_data:
    name: postgres_volume
  prometheus_data:
    name : prometheus_volume
  grafana_data:
    name : grafana_volume

networks:
  default:
    name: quiz_network
